[package]
name = "ironsift"
version = "0.1.0"
edition = "2021"

[lib]
name = "ironsift"
path = "src/lib.rs"

[[bin]]
name = "generator"
path = "bin/generator.rs"

[[bin]]
name = "ironsift"
path = "src/main.rs"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
csv = "1.3"

# Machine Learning (Clustering)
linfa = "0.7"
linfa-clustering = "0.7"
linfa-nn = "0.7"
ndarray = "0.15"

# Utils
rand = "0.8"