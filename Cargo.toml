[package]
name = "ironsift"
version = "0.4.0"
edition = "2021"
description = "Where's Waldo?"

[lib]
name = "ironsift"
path = "src/lib.rs"

[[bin]]
name = "generator"
path = "bin/generator.rs"

[[bin]]
name = "ironsift"
path = "bin/main.rs"

[[example]]
name = "simple"
path = "examples/simple.rs"

[[example]]
name = "builder"
path = "examples/builder.rs"

[[example]]
name = "json_parsing"
path = "examples/json_parsing.rs"

[dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# Machine Learning (Clustering)
linfa = "0.7"
linfa-clustering = "0.7"
linfa-nn = "0.7"
ndarray = "0.15"

# Parallel Processing
rayon = "1.8"

# Utilities
rand = "0.8"
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
log = "0.4"
env_logger = "0.11"

[dev-dependencies]
tempfile = "3.8"